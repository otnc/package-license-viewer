name: release

# Run this workflow manually and give it a version. It bumps package.json, updates CHANGELOG.md from Conventional Commits (via git-cliff, see cliff.toml), builds the .vsix, publishes it, then commits, tags and creates the GitHub Release.
#
# Publishing is skipped automatically when VSCE_PAT is absent, so this workflow is usable
# before you have a token.
#   VSCE_PAT  Azure DevOps PAT with the Marketplace > Manage scope
#             https://marketplace.visualstudio.com/manage
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release: a semver bump (patch/minor/major/prerelease) or an explicit version (e.g. 0.2.0)"
        required: true
        default: patch
      dry_run:
        description: "Build and verify only; do not publish, commit or tag"
        type: boolean
        default: false

permissions:
  contents: write # push the version commit/tag and create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run check-types
      - run: npm test
      # Loads the bundle in a real extension host, which is the only check that catches a
      # bundling problem before it reaches users
      - run: xvfb-run -a npm run test:integration

      - name: Bump version
        id: bump
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          echo "version=v${NEW}" >> "$GITHUB_OUTPUT"
          echo "raw=${NEW}" >> "$GITHUB_OUTPUT"
          echo "vsix=package-license-viewer-${NEW}.vsix" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is already ${NEW}; skipping the bump commit but still releasing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Generates the [x.y.z] section from Conventional Commits since the last tag and prepends it to CHANGELOG.md, so it's ready both for the commit below and for the release notes.
      - name: Update changelog
        if: ${{ !inputs.dry_run && steps.bump.outputs.changed == 'true' }}
        run: npx git-cliff --unreleased --tag "${{ steps.bump.outputs.version }}" --prepend CHANGELOG.md

      # Regenerates README.md/README.ja.md/CONTRIBUTING.md/CONTRIBUTING.ja.md from i18n/*.base.md, so a release never ships with generated docs that drifted out of sync with their base source. Its output is included in the release commit below (git commit -am).
      - name: Build documentation
        run: npm run docs:build

      # vsce package runs vscode:prepublish, which type-checks and does the production build
      - name: Package extension
        run: npx vsce package --out "${{ steps.bump.outputs.vsix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.bump.outputs.vsix }}
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ !inputs.dry_run && env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath "${{ steps.bump.outputs.vsix }}"

      # Only tag once publishing succeeded, so a failed release leaves no dangling tag behind
      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit when the bump actually changed package.json, or the docs build above produced a diff (i18n/*.base.md changed since the last release but nobody ran npm run docs:build locally); otherwise just tag and release.
          if [ "${{ steps.bump.outputs.changed }}" = "true" ] || ! git diff --quiet; then
            git commit -am "release: ${{ steps.bump.outputs.version }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.version }}" >/dev/null; then
            git tag "${{ steps.bump.outputs.version }}"
          fi
          git push origin HEAD "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prefer the freshly generated CHANGELOG entry; fall back to generated notes when it's empty (e.g. every commit since the last tag was filtered out by cliff.toml).
          awk -v version="${{ steps.bump.outputs.raw }}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${{ steps.bump.outputs.version }}" "${{ steps.bump.outputs.vsix }}" \
              --title "${{ steps.bump.outputs.version }}" --notes-file release-notes.md
          else
            gh release create "${{ steps.bump.outputs.version }}" "${{ steps.bump.outputs.vsix }}" \
              --title "${{ steps.bump.outputs.version }}" --generate-notes
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ steps.bump.outputs.vsix }}"
            echo ""
            echo "| Target | Status |"
            echo "| --- | --- |"
            echo "| VS Code Marketplace | ${{ !inputs.dry_run && env.VSCE_PAT != '' && 'published' || 'skipped' }} |"
            echo "| Tag and GitHub Release | ${{ !inputs.dry_run && 'created' || 'skipped (dry run)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
